<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consolas</title>
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
  <link rel="stylesheet" th:href="@{/crud.css}" href="/crud.css">
</head>
<body>
  <main class="contenedor">
    <a class="volver" th:href="@{/categorias.html}" href="/categorias.html">← Categorías</a>
    <header>
      <h1>Consolas</h1>
      <a class="accion nuevo" th:href="@{/consolas/nuevo}" href="/consolas/nuevo">Añadir consola</a>
    </header>

    <div class="tabla" th:if="${!consolas.isEmpty()}">
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Fabricante</th><th>Generación</th><th>Ventas (millones)</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <tr th:each="consola : ${consolas}">
            <td th:text="${consola.idConsola}">1</td>
            <td th:text="${consola.nombre}">Game Boy</td>
            <td th:text="${consola.fabricante}">Nintendo</td>
            <td th:text="${consola.generacion}">1</td>
            <td th:text="${consola.ventas}">118.7</td>
            <td class="acciones">
              <a th:href="@{/consolas/{id}(id=${consola.idConsola})}">Ver</a>
              <a th:href="@{/consolas/editar/{id}(id=${consola.idConsola})}">Editar</a>
              <form th:action="@{/consolas/borrar/{id}(id=${consola.idConsola})}" method="post"
                    onsubmit="return confirm('¿Borrar esta consola?')">
                <button type="submit">Borrar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="panel" th:if="${consolas.isEmpty()}">No hay consolas guardadas.</p>
  </main>
</body>
</html>
