<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${tituloPagina}">Nuevo videojuego</title>
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
  <link rel="stylesheet" th:href="@{/crud.css}" href="/crud.css">
</head>
<body>
  <main class="contenedor estrecho">
    <a class="volver" th:href="@{/videojuegos}" href="/videojuegos">← Volver al listado</a>
    <section class="panel">
      <h1 th:text="${tituloPagina}">Nuevo videojuego</h1>
      <p class="error" th:if="${error}" th:text="${error}"></p>
      <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post" class="formulario">
        <input type="hidden" th:field="*{idVideojuego}">
        <label>Título
          <input type="text" th:field="*{titulo}" maxlength="80" required>
        </label>
        <label>Estudio
          <input type="text" th:field="*{estudio}" maxlength="80" required>
        </label>
        <label>Año de lanzamiento
          <input type="number" th:field="*{lanzamiento}" min="1" required>
        </label>
        <label>Precio (€)
          <input type="number" th:field="*{precio}" min="0" step="0.01" required>
        </label>
        <button class="accion nuevo" type="submit">Guardar</button>
      </form>
    </section>
  </main>
</body>
</html>
