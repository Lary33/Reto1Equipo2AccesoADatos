<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del videojuego</title>
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
  <link rel="stylesheet" th:href="@{/crud.css}" href="/crud.css">
</head>
<body>
  <main class="contenedor estrecho">
    <a class="volver" th:href="@{/videojuegos}" href="/videojuegos">← Volver al listado</a>
    <section class="panel">
      <h1 th:text="${videojuego.titulo}">Minecraft</h1>
      <p><strong>ID:</strong> <span th:text="${videojuego.idVideojuego}">1</span></p>
      <p><strong>Estudio:</strong> <span th:text="${videojuego.estudio}">Mojang</span></p>
      <p><strong>Año de lanzamiento:</strong> <span th:text="${videojuego.lanzamiento}">2009</span></p>
      <p><strong>Precio:</strong> <span th:text="${videojuego.precio} + ' €'">30.0 €</span></p>
      <div class="acciones">
        <a class="accion" th:href="@{/videojuegos/editar/{id}(id=${videojuego.idVideojuego})}">Editar</a>
        <form th:action="@{/videojuegos/borrar/{id}(id=${videojuego.idVideojuego})}" method="post"
              onsubmit="return confirm('¿Borrar este videojuego?')">
          <button class="accion borrar" type="submit">Borrar</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
